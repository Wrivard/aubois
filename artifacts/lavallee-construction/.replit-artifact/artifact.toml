kind = "web"
previewPath = "/"
title = "Gestion Jagster Inc."
description = "Site vitrine en français pour Gestion Jagster Inc., entrepreneur général en rénovation résidentielle à Québec et dans les environs, avec services, projets illustratifs, FAQ, coordonnées et demandes de soumission gratuite par courriel."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
