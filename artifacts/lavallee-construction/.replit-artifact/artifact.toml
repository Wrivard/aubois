kind = "web"
previewPath = "/"
title = "O. Renaud Construction Inc."
description = "Site vitrine en français pour O. Renaud Construction Inc. à Victoriaville, avec services, projets, FAQ, coordonnées et préparation de demandes de soumission par courriel."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
