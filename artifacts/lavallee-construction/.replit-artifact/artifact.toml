kind = "web"
previewPath = "/"
title = "Service d’Arbres Aubois"
description = "Site vitrine en français pour Service d’Arbres Aubois, avec services arboricoles, section d’assurance et de certifications, coordonnées et formulaire de soumission."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
