kind = "web"
previewPath = "/"
title = "Service d’Arbres Aubois"
description = "Site vitrine en français pour Service d’Arbres Aubois, entreprise offrant des services d’élagage, d’abattage d’arbres, de taille de haies et d’entretien des arbres à Montmagny et Berthier-sur-Mer."
version = "1.0.0"
id = "artifacts/lavallee-construction"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20943

[services.development]
run = "pnpm --filter @workspace/lavallee-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lavallee-construction", "run", "build" ]
serve = "static"
publicDir = "artifacts/lavallee-construction/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20943"
BASE_PATH = "/"
